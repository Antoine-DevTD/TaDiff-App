<!doctype html>
<html lang="fr">
  <body style="margin:0;background:#e8eef7;font-family:Arial,sans-serif;color:#0f172a">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#e8eef7"><tr><td align="center" style="padding:32px 16px">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff">
        <tr><td style="background:#1d1d1f;padding:20px 28px"><img src="https://tadiff.com/email/tadiff-logo-email.png" width="68" height="68" alt="TaDiff" style="display:block;width:68px;height:68px;border:0"></td></tr>
        <tr><td style="padding:32px 28px">
          <h1 style="margin:0 0 18px;font-size:26px;line-height:1.25">Choisissez un nouveau mot de passe</h1>
          <p style="margin:0 0 16px;font-size:16px;line-height:1.6">Une demande de nouveau mot de passe a été effectuée pour votre compte TaDiff.</p>
          <p style="margin:28px 0"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#1d4ed8;color:#ffffff;text-decoration:none;padding:13px 20px;border-radius:6px;font-weight:700">Choisir un nouveau mot de passe</a></p>
          <p style="margin:0;font-size:14px;line-height:1.6;color:#4f5a6b">Si vous n'avez pas demandé cette modification, ignorez cet email.</p>
          <p style="margin:28px 0 0;font-size:13px;color:#4f5a6b">Besoin d'aide ? <a href="mailto:support@tadiff.com" style="color:#1d4ed8">support@tadiff.com</a></p>
        </td></tr>
      </table>
    </td></tr></table>
  </body>
</html>
